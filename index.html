<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가이드 모음 · ai_masterin30days</title>
<link rel="icon" href="assets/logo-bubble.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--cream:#F7F4EE;--ink:#2B1416;--mute:#8A7F7C;--lav:#D9D0F7;--violet:#8C6BE6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Pretendard,system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:40px 20px 56px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .brand img{width:44px;height:44px;border-radius:50%}
  .brand b{font-size:16px}
  h1{font-size:30px;line-height:1.2;letter-spacing:-.03em;margin:0 0 6px}
  p.sub{color:var(--mute);margin:0 0 28px}
  a.card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--ink);
    border-radius:18px;padding:18px 20px;margin-bottom:12px;color:inherit;text-decoration:none;
    transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .18s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}
  a.card:active{transform:translateY(1px);box-shadow:none}
  .t{font-weight:700;font-size:17px}.e{color:var(--mute);font-size:13px;margin-top:2px}
  .arrow{width:34px;height:34px;border-radius:50%;background:var(--lav);display:grid;place-items:center;flex:none}
  footer{margin-top:32px;color:var(--mute);font-size:13px}
  footer a{color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="assets/logo-bubble.svg" alt=""><b>ai_masterin30days</b></div>
  <h1>코딩 없이 AI로 만들기<br>가이드 모음</h1>
  <p class="sub">Build with AI. No code. Copy-ready prompts inside.</p>
  <a class="card" href="ui-names/"><div><div class="t">UI 이름 6개</div><div class="e">6 UI names to tell AI exactly</div></div><span class="arrow">→</span></a>
  <a class="card" href="before-prompt/"><div><div class="t">시키기 전 6가지</div><div class="e">6 things to decide before you ask AI</div></div><span class="arrow">→</span></a>
  <a class="card" href="notify/"><div><div class="t">알림 이름 6개</div><div class="e">6 ways to give a heads-up</div></div><span class="arrow">→</span></a>
  <a class="card" href="choose/"><div><div class="t">고르는 화면 6개</div><div class="e">6 ways to let people choose</div></div><span class="arrow">→</span></a>
  <footer>새 가이드는 매일 하나씩 · <a href="https://www.instagram.com/ai_masterin30days/">@ai_masterin30days</a></footer>
</main>
</body>
</html>
